    background-size:100% 100%;background-position:center;background-repeat:no-repeat;background-attachment:fixed;
    color:var(--txt);line-height:1.6;min-height:100vh;padding:14px;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:rgba(13,15,20,.60);}
  .wrap{max-width:860px;margin:0 auto;}
  header{margin-bottom:16px;}
  h1{font-size:21px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--brand),var(--pink),var(--brand2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .tip{font-size:12px;color:var(--sub);margin-top:6px;}

  .card{background:rgba(22,26,33,.55);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;margin-bottom:12px;}
  .card.solid{background:rgba(22,26,33,.94);backdrop-filter:none;-webkit-backdrop-filter:none;border-color:var(--line);}
  .card h2{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px;letter-spacing:.5px;
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .card h2 .tag{font-size:10px;font-weight:500;color:var(--brand);
    background:rgba(91,140,255,.12);padding:2px 7px;border-radius:20px;}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;}
  .tab{flex:1;min-width:72px;text-align:center;padding:11px 4px;border-radius:10px;
    background:var(--panel2);border:1px solid var(--line);color:var(--sub);
    font-size:13px;font-weight:600;cursor:pointer;transition:.18s;user-select:none;}
  .tab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(91,140,255,.25);}
  .tab small{display:block;font-size:10px;font-weight:400;opacity:.85;}

  label{font-size:12px;color:var(--sub);display:block;margin:12px 0 6px;}
  textarea,input[type=text],input[type=password],input[type=number],select{
    width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font-size:14px;padding:11px 12px;
    font-family:ui-monospace,Menlo,Consolas,monospace;outline:none;transition:border-color .18s;}
  textarea{min-height:110px;resize:vertical;}
  textarea:focus,input:focus,select:focus{border-color:var(--brand);}
  select{font-family:inherit;cursor:pointer;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row>*{flex:1;min-width:130px;}
  .opt{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .opt label{margin:0;}

  .btn{width:100%;padding:13px;border:0;border-radius:10px;font-size:15px;font-weight:700;
    cursor:pointer;transition:.16s;margin-top:8px;}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:var(--panel2);color:var(--sub);border:1px solid var(--line);}
  .btn-ghost:active{transform:scale(.98);}
  .btn-sm{padding:8px 12px;font-size:13px;width:auto;margin:0;}
  .btn-sm:active{transform:scale(.96);}
  .btn.danger{background:linear-gradient(135deg,var(--err),#ff8e53);}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .actions .btn-sm{flex:1;min-width:86px;}

  .badge{position:absolute;right:10px;top:10px;font-size:11px;padding:3px 8px;border-radius:6px;
    background:rgba(91,140,255,.15);color:var(--brand);font-weight:600;}
  .count{font-size:11px;color:var(--sub);text-align:right;margin-top:4px;}
  .copy{position:relative;}

  .note{font-size:12px;color:var(--sub);background:rgba(91,140,255,.08);
    border-left:3px solid var(--brand);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:12px;line-height:1.7;}
  .note.warn{border-left-color:var(--warn);background:rgba(255,180,84,.08);}
  .note.err{border-left-color:var(--err);background:rgba(255,107,107,.08);}
  .note.ok{border-left-color:var(--ok);background:rgba(61,220,151,.08);}
  .note b{color:var(--txt);}
  .note kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;}

  details{margin-top:12px;}
  summary{cursor:pointer;font-size:13px;color:var(--brand);font-weight:600;padding:6px 0;}
  details p{font-size:12.5px;color:var(--sub);margin-top:6px;}

  .kv{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:10px;
    padding:7px 0;border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:0;}
  .kv b{color:var(--txt);font-family:ui-monospace,Menlo,monospace;font-weight:600;word-break:break-all;text-align:right;}

  footer{font-size:11px;color:#5a6272;text-align:center;margin-top:20px;line-height:1.8;}

  /* 摩斯播放器 - 专业版 */
  #morsePlayBtn{width:100%;}
  #morseLight{width:100%;height:52px;border-radius:12px;background:#111;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:26px;color:#333;
    transition:background .03s,color .03s;margin-top:10px;font-weight:700;}
  #morseLight.on{background:var(--warn);color:#1a1200;box-shadow:0 0 24px var(--warn);}
  .morse-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;}
  .morse-table th,.morse-table td{border:1px solid var(--line);padding:5px 8px;text-align:center;}
  .morse-table th{background:var(--panel2);color:var(--sub);font-weight:600;}
  .morse-table td{font-family:ui-monospace,Menlo,monospace;}
  .morse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px;margin-top:8px;}
  .morse-grid div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;}
  .morse-grid div b{display:block;color:var(--brand);font-size:13px;}

  /* 专业摩斯模块新增样式 */
  #morseSource{font-family:ui-monospace,Menlo,monospace;font-size:15px;line-height:2.2;
    letter-spacing:2px;min-height:50px;word-break:break-all;padding:4px 0;}
  #morseSource .ch{display:inline-block;padding:0 2px;border-radius:4px;transition:background .08s,color .08s;}
  #morseSource .ch.current{background:var(--warn);color:#1a1200;box-shadow:0 0 10px rgba(255,180,84,.5);}
  #morseSource .ch.done{color:var(--ok);opacity:.6;}
  #morseSource .ch.unknown{color:var(--err);}
  #morseTimeline{width:100%;height:64px;background:var(--panel2);border:1px solid var(--line);
    border-radius:10px;margin-top:10px;cursor:pointer;}
  #morseStats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px;}
  #morseStats .stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;}
  #morseStats .stat .lbl{font-size:11px;color:var(--sub);}
  #morseStats .stat .val{font-size:15px;font-weight:700;color:var(--txt);font-family:ui-monospace,Menlo,monospace;}
  #morseTrainBox{margin-top:10px;}
  #morseTrainInput{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:var(--txt);font-size:18px;padding:14px 12px;text-align:center;letter-spacing:4px;
    font-family:ui-monospace,Menlo,monospace;outline:none;margin-top:8px;}
  #morseTrainInput:focus{border-color:var(--brand);}
  #morseTrainFeedback{font-size:13px;margin-top:8px;text-align:center;min-height:20px;}
  #morseTrainFeedback.ok{color:var(--ok);}
  #morseTrainFeedback.err{color:var(--err);}
  .train-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .train-row .btn-sm{flex:1;min-width:100px;}
  .koch-progress{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .koch-char{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:12px;}
  .koch-char .c{font-weight:700;font-size:14px;color:var(--brand);}
  .koch-char .rate{font-size:10px;color:var(--sub);}
  .koch-char.mastered{border-color:var(--ok);}
  .koch-char.mastered .c{color:var(--ok);}
  .koch-char.struggle{border-color:var(--err);}
  .koch-char.struggle .c{color:var(--err);}
  #morseWpmSlider{width:100%;margin-top:4px;accent-color:var(--brand);}
  .seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px;}
  .seg button{flex:1;padding:8px;background:var(--panel2);border:0;color:var(--sub);font-size:12px;
    cursor:pointer;transition:.16s;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:0;}
  .seg button.active{background:var(--brand);color:#fff;}

  /* 强度条 */
  .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:6px;}
  .bar>i{display:block;height:100%;width:0;transition:width .3s,background .3s;}
  .crit{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:12px;}
  .crit span{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--sub);}
  .crit span.yes{color:var(--ok);border-color:rgba(61,220,151,.4);}

  /* 二维码 */
  #qrBox{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;}
  #qrCanvas{background:#fff;padding:12px;border-radius:12px;max-width:100%;height:auto;}
  #qrText{font-size:11px;color:var(--sub);word-break:break-all;text-align:center;}

  #diffBox{font-size:12.5px;font-family:ui-monospace,Menlo,monospace;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;
    white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;}
  #diffBox .eq{color:var(--ok);} #diffBox .ne{color:var(--err);background:rgba(255,107,107,.15);}

  #drop{border:2px dashed var(--line);border-radius:12px;padding:24px;text-align:center;
    color:var(--sub);font-size:13px;transition:.2s;cursor:pointer;}
  #drop.drag{border-color:var(--brand);background:rgba(91,140,255,.08);color:var(--brand);}
  .file-info{font-size:12px;color:var(--sub);margin-top:10px;}

const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
const ui = { msgBox: null, outBox: null };
const escapeReg = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function b64encode(bytes){
  const a = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let s = '';
  for (let i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
  return btoa(s);
}
function b64decode(str){
  const s = atob(str.trim());
  const o = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i);
  return o;
}
function utf8(s){ return enc.encode(s); }
function fromUtf8(b){ return dec.decode(b); }
function setMsg(txt, cls){
  if (!ui.msgBox) return;
  ui.msgBox.textContent = txt;
  ui.msgBox.className = 'note' + (cls ? ' ' + cls : '');
}
function escHtml(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function flashBadge(){
  const b = $('badge'); if (!b) return;
  b.style.display = 'inline-block';
  setTimeout(() => b.style.display = 'none', 1400);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); ta.remove(); return true; }
    catch(e2){ ta.remove(); return false; }
  }
}
function bindCount(el, msg){
  const f = () => {
    const v = el.value;
    const b = utf8(v).length;
    msg.textContent = b + ' 字节 / ' + v.length + ' 字符 / ' + (v.match(/\n/g)||[]).length + ' 行';
  };
  el.addEventListener('input', f); f();
}

/* ============ 视图路由 ============ */
const VIEWS = {};
function render(mode){
  if (!VIEWS[mode]) { $('view').innerHTML = '<div class="note err">未知模式</div>'; return; }
  $('view').innerHTML = VIEWS[mode]();
  ui.msgBox = $('msg'); ui.outBox = $('out');
  bindEvents(mode);
}
document.getElementById('modeTabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (!t) return;
  document.querySelectorAll('#modeTabs .tab').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  render(t.dataset.mode);
});

function symParams(){
  const A = STATE.algo;
  let h = `<label for="key">密码 / 密钥</label><input type="password" id="key" placeholder="输入密码，留空则使用随机密钥">
    <div class="opt"><input type="checkbox" id="showKey"><label for="showKey" style="margin:0">显示密码</label></div>`;
  if (['aes','aes-cbc','chacha'].includes(A)){
    h += `<div class="row">
      <div><label for="iter">PBKDF2 迭代次数</label><input type="number" id="iter" value="310000" min="10000" step="10000"></div>
      <div><label for="klen">密钥长度</label><select id="klen><option>128</option><option selected>256</option></select></div>
    </div>
    <div class="note">密码经 PBKDF2-SHA256 派生密钥，每次加密自动生成随机盐与 IV，同一内容密文每次不同。</div>`;
  } else if (A === 'rc4') {
    h += `<div class="note warn">ARC4 存在已知弱点，仅用于兼容旧系统，不要用于新场景。</div>`;
  } else if (A === '3des') {
    h += `<div class="note warn">3DES 已逐渐被淘汰，NIST 建议迁移至 AES。</div>`;
  } else if (A === 'caesar') {
    h += `<label for="shift">偏移量</label><input type="number" id="shift" value="3">
      <div class="note">凯撒移位，支持负数，自动对 26 取模。</div>`;
  } else if (['vigenere','autokey','beaufort','playfair'].includes(A)){
    h += `<label for="k">密钥词（仅字母 A-Z）</label><input type="text" id="k" value="KEY">
      <div class="note">${A==='autokey'?'Autokey：密钥词后接明文本身作为密钥流':'Beaufort：维吉尼亚的对称变体，加解密操作相同'}</div>`;
  } else if (A === 'xor') {
    h += `<div class="note">异或密码，密钥重复使用，安全性很低，仅作演示。</div>`;
  } else if (A === 'morse') {
    h += `<label for="morseSep">符号分隔符</label><input type="text" id="morseSep" value=" ">
      <label for="morseChar">单词分隔符</label><input type="text" id="morseChar" value=" / ">
      <div class="note">摩斯是编码不是加密，默认符号间空格、词间 " / "。切换到「摩斯密码」模块可发声与闪光。</div>`;
  }
  $('params').innerHTML = h;
  const sk = $('showKey');
  if (sk) sk.onchange = () => { const k = $('key'); if(k) k.type = sk.checked ? 'text' : 'password'; };
}

/* ============ 对称算法实现 ============ */
const STATE = { algo: 'aes' };
function runSym(A, text, isEnc){
  if (A === 'aes' || A === 'aes-cbc'){
    const key = $('key').value || '';
    if (isEnc && !key) throw new Error('请填写密码');
    return symCrypto(text, A === 'aes-cbc' ? 'AES-CBC' : 'AES-GCM', key, isEnc);
  }
  if (A === 'chacha'){
    const key = $('key').value || '';
    if (isEnc && !key) throw new Error('请填写密码');
    return symChaCha(text, key, isEnc);
  }
  if (A === 'rc4'){
    const key = $('key').value || 'key';
    return rc4(text, key, isEnc);
  }
  if (A === '3des'){
    const key = $('key').value || '';
    if (isEnc && !key) throw new Error('请填写密码');
    return sym3DES(text, key, isEnc);
  }
  if (A === 'caesar'){
    const n = parseInt($('shift').value || '3', 10);
    return caesar(text, isEnc ? n : -n);
  }
  if (A === 'rot13') return caesar(text, 13);
  if (A === 'atbash') return atbash(text);
  if (['vigenere','autokey','beaufort','playfair'].includes(A)){
    const key = ($('k').value || '').toUpperCase().replace(/[^A-Z]/g, '');
    if (!key) throw new Error('请输入密钥词');
    if (A === 'vigenere') return vigenere(text, key, isEnc);
    if (A === 'autokey') return autokey(text, key, isEnc);
    if (A === 'beaufort') return beaufort(text, key, isEnc);
    return playfair(text, key, isEnc);
  }
  if (A === 'xor'){
    const key = $('key').value; if (!key) throw new Error('请输入密钥');
    const kb = utf8(key), tb = utf8(text);
    const o = new Uint8Array(tb.length);
    for (let i = 0; i < tb.length; i++) o[i] = tb[i] ^ kb[i % kb.length];
    return isEnc ? b64encode(o) : fromUtf8(o);
  }
  if (A === 'morse'){
    const sep = $('morseSep').value, cs = $('morseChar').value;
    if (isEnc){
      return text.toUpperCase().split('').map(c => c === ' ' ? cs.trim() : (MORSE[c] !== undefined ? MORSE[c] : c)).join(sep);
    }
    const rev = morseRev();
    let r = '';
    text.trim().split(escapeReg(cs)).forEach((w, wi) => {
      if (wi > 0) r += ' ';
      w.split(escapeReg(sep)).forEach(s => { if(s) r += rev[s] !== undefined ? rev[s] : '?'; });
    });
    return r.toLowerCase();
  }
  if (A === 'base64') return isEnc ? b64encode(utf8(text)) : fromUtf8(b64decode(text));
}

/* Web Crypto 对称 */
async function symCrypto(text, algo, pwd, enc){
  const iter = parseInt($('iter').value || '310000', 10);
  const klen = parseInt($('klen').value || '256', 10);
  if (enc){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(algo === 'AES-GCM' ? 12 : 16));
    const k = await deriveKey(pwd, salt, iter, klen);
    const ct = await crypto.subtle.encrypt({ name: algo, iv }, k, utf8(text));
    const parts = [salt, iv, new Uint8Array(ct)];
    return b64encode(concat(parts));
  } else {
    const all = b64decode(text);
    const salt = all.slice(0, 16), iv = all.slice(16, algo === 'AES-GCM' ? 28 : 32);
    const ct = all.slice(algo === 'AES-GCM' ? 28 : 32);
    const k = await deriveKey(pwd, salt, iter, klen);
    const pt = await crypto.subtle.decrypt({ name: algo, iv }, k, ct);
    return fromUtf8(pt);
  }
}
async function deriveKey(pwd, salt, iter, klen){
  const base = await crypto.subtle.importKey('raw', utf8(pwd), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: klen }, false, ['encrypt', 'decrypt']);
}
function concat(parts){
  const len = parts.reduce((a, p) => a + p.length, 0);
  const o = new Uint8Array(len);
  let off = 0;
  for (const p of parts) { o.set(p, off); off += p.length; }
  return o;
}
function caesar(t, n){
  n = ((n % 26) + 26) % 26;
  return t.replace(/[A-Za-z]/g, c => {
    const b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode((c.charCodeAt(0) - b + n) % 26 + b);
  });
}
function atbash(t){
  return t.replace(/[A-Za-z]/g, c => {
    const b = c <= 'Z' ? 65 : 97;
    return String.fromCharCode(b + (25 - (c.charCodeAt(0) - b)));
  });
}
function vigenere(t, key, enc){
  let i = 0;
  return t.replace(/[A-Za-z]/g, c => {
    const b = c <= 'Z' ? 65 : 97, k = key[i % key.length].charCodeAt(0) - 65;
    const n = ((c.charCodeAt(0) - b + (enc ? k : 26 - k)) % 26 + 26) % 26;
    i++; return String.fromCharCode(b + n);
  });
}
function autokey(t, key, enc){
  if (enc){
    let ks = key.split(''), i = 0;
    return t.toUpperCase().replace(/[A-Z]/g, c => {
      const k = ks[i % ks.length].charCodeAt(0) - 65;
      const n = (c.charCodeAt(0) - 65 + k) % 26;
      ks.push(String.fromCharCode(n + 65));
      i++; return String.fromCharCode(n + 65);
    });
  } else {
    let out = '', i = 0;
    return t.toUpperCase().replace(/[A-Z]/g, c => {
      const k = key[i < key.length ? i : out.length - (i - key.length)].charCodeAt(0) - 65;
      const n = (c.charCodeAt(0) - 65 + 26 - k) % 26;
      out += String.fromCharCode(n + 65);
      i++; return String.fromCharCode(n + 65);
    });
  }
}
function beaufort(t, key, enc){
  return t.toUpperCase().replace(/[A-Z]/g, c => {
    const k = key[(c.charCodeAt(0) - 65) % key.length].charCodeAt(0) - 65;
    return String.fromCharCode((k - (c.charCodeAt(0) - 65) + 26) % 26 + 65);
  }).toLowerCase();
}
function playfair(t, key, enc){
  const a = 'ABCDEFGHIKLMNOPQRSTUVWXYZ';
  let k = key.replace(/J/g, 'I');
  for (const c of key) if (c >= 'A' && c <= 'Z' && !k.includes(c)) k += c;
  for (const c of a) if (!k.includes(c)) k += c;
  function pos(c){ const i = k.indexOf(c); return [i % 5, Math.floor(i / 5)]; }
  let s = t.toUpperCase().replace(/J/g, 'I').replace(/[^A-Z]/g, '');
  let pairs = [];
  for (let i = 0; i < s.length; i += 2){
    let a = s[i], b = s[i + 1] || 'X';
    if (a === b){ pairs.push([a, 'X']); i--; }
    else pairs.push([a, b]);
  }
  return pairs.map(([x, y]) => {
    let [cx, rx] = pos(x), [cy, ry] = pos(y);
    if (rx === ry){ cx = (cx + (enc ? 1 : 4)) % 5; cy = (cy + (enc ? 1 : 4)) % 5; }
    else if (cx === cy){ rx = (rx + (enc ? 1 : 4)) % 5; ry = (ry + (enc ? 1 : 4)) % 5; }
    else { [cx, cy] = [cy, cx]; }
    return k[ry * 5 + cx] + k[rx * 5 + cy];
  }).join('');
}

/* 3DES */
async function sym3DES(text, pwd, enc){
  const k = await ensureDesKey(pwd);
  const iv = enc ? crypto.getRandomValues(new Uint8Array(8)) : new Uint8Array(8);
  const importIV = iv.slice(0, 8);
  if (!enc && text.length) {
    const all = b64decode(text);
    iv.set(all.slice(0, 8));
    const ct = all.slice(8);
    const dk = await crypto.subtle.importKey('raw', await k, 'DES-EDE-CBC', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'DES-EDE-CBC', iv: importIV }, dk, ct);
    return fromUtf8(pt);
  }
  const dk = await crypto.subtle.importKey('raw', await k, 'DES-EDE-CBC', false, ['encrypt']);
  const padLen = 8 - (utf8(text).length % 8 || 8);
  const padded = concat([utf8(text), new Uint8Array(padLen).fill(padLen)]);
  const ct = await crypto.subtle.encrypt({ name: 'DES-EDE-CBC', iv: importIV }, dk, padded);
  return b64encode(concat([iv, new Uint8Array(ct)]));
}
async function ensureDesKey(pwd){
  let raw = utf8(pwd);
  if (raw.length < 24) { const t = new Uint8Array(24); t.set(raw); raw = t; }
  return raw.slice(0, 24);
}

/* RC4 */
function rc4(text, key, enc){
  const kb = utf8(key), tb = utf8(text);
  const S = new Uint8Array(256);
  for (let i = 0; i < 256; i++) S[i] = i;
  let j = 0;
  for (let i = 0; i < 256; i++){ j = (j + S[i] + kb[i % kb.length]) % 256; [S[i], S[j]] = [S[j], S[i]]; }
  let i2 = 0, j2 = 0;
  const out = new Uint8Array(tb.length);
  for (let n = 0; n < tb.length; n++){
    i2 = (i2 + 1) % 256; j2 = (j2 + S[i2]) % 256;

/* ============ 摩斯播放器 - 专业版（事件时间线引擎） ============ */
let morseCtx = null, morseStop = false, morseTimer = null;
let morseSchedule = [];        // 事件时间线
let morseTotalDur = 0;         // 总时长（秒）
let morsePlayStart = 0;        // 播放起点（performance.now()）
let morseBaseTime = 0;         // 时间线起点（AudioContext.currentTime）
let morsePlayOffset = 0;       // 暂停时的偏移（秒）
let morseRafId = null;         // 动画帧 ID
let morsePre = 0;              // 预调度边界

/* --- 节奏计算：标准 / Farnsworth 双参数 --- */
function morseTiming(){
  const c = clamp(parseInt($('mWpm').value || '18', 10), 5, 40);
  const fn = $('mFarnsworth');
  const farnsworth = fn && fn.checked;
  const s = farnsworth ? clamp(parseInt($('mEffWpm').value || '8', 10), 5, 40) : c;
  // 单位时长（秒）= 1.2 / 字符速度
  const u = 1.2 / c;
  // 标准字母间隔 3u、单词间隔 7u
  let charGap = 3 * u, wordGap = 7 * u;
  if (farnsworth && s < c){
    // ARRL Farnsworth：额外延迟按 3:7 分配到 19 个间隔单位
    // Ta = (60c - 37.2s)/(sc)，额外字母间隔 = 3*Ta/19，额外单词间隔 = 7*Ta/19
    const Ta = (60 * c - 37.2 * s) / (s * c);
    charGap += 3 * Ta / 19;
    wordGap += 7 * Ta / 19;
  }
  return { u, dot: u, dash: 3 * u, intra: u, char: charGap, word: wordGap, c, s };
}
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

/* --- 自动检测：输入是明文还是摩斯 --- */
const MORSE_INPUT_RE = /^[\s./_\-\u00B7\u2014]+$/;
function detectMorseMode(input){
  if (!input.trim()) return 'text';
  return MORSE_INPUT_RE.test(input) ? 'morse' : 'text';
}

/* --- 生成确定性事件时间线 --- */
function buildSchedule(text){
  const t = String(text || '').toUpperCase();
  const tm = morseTiming();
  const events = [];   // {type, start, dur, charIdx, ch, sym}
  let time = 0;
  let charIdx = -1;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (c === ' '){
      time += tm.word; // 单词间隔
      continue;
    }
    charIdx++;
    const code = MORSE[c];
    if (!code){
      // 不可译字符：插入一个字母间隔的静音
      time += tm.char;
      continue;
    }
    for (let j = 0; j < code.length; j++){
      const sym = code[j];
      const dur = sym === '.' ? tm.dot : tm.dash;
      events.push({ type: 'mark', start: time, dur, charIdx, ch: c, sym, units: sym === '.' ? 1 : 3 });
      time += dur + tm.intra; // 符号 + 符内间隔
    }
    time += tm.char - tm.intra; // 补齐到字母间隔
  }
  return { events, duration: time, tm };
}

/* --- 渲染：音频（实时预调度）+ 时间线消费 --- */
function renderAudio(ctx, schedule, baseTime, soundOn, tone, freq){
  if (!soundOn) return;
  const { events, tm } = schedule;
  const a = Math.min(0.005, tm.u * 0.05); // 包络 attack/release
  const level = 0.7;
  for (const e of events){
    if (e.type !== 'mark') continue;
    if (e.start + e.dur < baseTime - baseTime) continue; // 全部渲染（实时从 0 开始）
    const t0 = baseTime + e.start;
    if (t0 > ctx.currentTime + 0.3) continue; // 只预调度 300ms 内
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tone === 'cw' ? 'sine' : tone === 'telegraph' ? 'triangle' : 'sine';
    osc.frequency.value = freq;
    // CW 侧音加少量二次谐波
    let osc2 = null;
    if (tone === 'cw'){
      osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.value = freq * 2;
      const g2 = ctx.createGain();
      g2.gain.value = 0.06;
      osc2.connect(g2); g2.connect(gain);
    }
    osc.connect(gain); gain.connect(ctx.destination);
    const tEnd = t0 + e.dur;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(level, t0 + a);
    gain.gain.setValueAtTime(level, tEnd - a);
    gain.gain.linearRampToValueAtTime(0.0001, tEnd);
    osc.start(t0); osc.stop(tEnd + 0.02);
    if (osc2){ osc2.start(t0); osc2.stop(tEnd + 0.02); }
  }
}

/* --- 播放控制 --- */
function playMorse(offset){
  if (!morseCtx) morseCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (morseCtx.state === 'suspended') morseCtx.resume();
  stopMorse(true); // 停掉旧播放，不重置高亮

  const text = $('morseText').value || '';
  const sound = $('mSound').checked, light = $('mLight').checked, loop = $('mLoop').checked;
  const vibrate = $('mVibrate') && $('mVibrate').checked;
  const freq = clamp(parseInt($('mFreq').value || '600', 10), 200, 1200);
  const tone = ($('mTone') || {}).value || 'sine';

  const sch = buildSchedule(text);
  if (!sch.events.length){ setMsg('没有可播放的内容', 'warn'); return; }
  morseSchedule = sch;
  morseTotalDur = sch.duration;
  morsePre = 0;

  // 更新统计
  updateMorseStats(sch);
  // 更新时间轴
  drawTimeline(sch);
  // 高亮原文
  highlightSource(-1);

  setMsg('播放中… 约 ' + morseTotalDur.toFixed(1) + ' 秒' + (loop ? '（循环）' : ''), '');
  morseStop = false;
  morsePlayOffset = offset || 0;
  morseBaseTime = morseCtx.currentTime - morsePlayOffset;
  morsePlayStart = performance.now() - morsePlayOffset * 1000;

  scheduleAhead();
  tickPlayback();
}

function scheduleAhead(){
  if (morseStop || !morseCtx) return;
  const horizon = morseCtx.currentTime + 0.3;
  const { events, tm } = morseSchedule;
  const sound = $('mSound').checked, light = $('mLight').checked;
  const vibrate = $('mVibrate') && $('mVibrate').checked;
  const freq = clamp(parseInt($('mFreq').value || '600', 10), 200, 1200);
  const tone = ($('mTone') || {}).value || 'sine';
  const a = Math.min(0.005, tm.u * 0.05);
  while (morsePre < events.length){
    const e = events[morsePre];
    const t0 = morseBaseTime + e.start;
    if (t0 > horizon) break;
    if (e.type === 'mark'){
      // 音频
      if (sound){
        const osc = morseCtx.createOscillator();
        const gain = morseCtx.createGain();
        osc.type = tone === 'cw' ? 'sine' : tone === 'telegraph' ? 'triangle' : 'sine';
        osc.frequency.value = freq;
        let osc2 = null;
        if (tone === 'cw'){
          osc2 = morseCtx.createOscillator();
          osc2.type = 'sine'; osc2.frequency.value = freq * 2;
          const g2 = morseCtx.createGain(); g2.gain.value = 0.06;
          osc2.connect(g2); g2.connect(gain);
        }
        osc.connect(gain); gain.connect(morseCtx.destination);
        const tEnd = t0 + e.dur;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.linearRampToValueAtTime(0.7, t0 + a);
        gain.gain.setValueAtTime(0.7, tEnd - a);
        gain.gain.linearRampToValueAtTime(0.0001, tEnd);
        osc.start(t0); osc.stop(tEnd + 0.02);
        if (osc2){ osc2.start(t0); osc2.stop(tEnd + 0.02); }
      }
      // 振动
      if (vibrate && navigator.vibrate){
        try { navigator.vibrate([Math.round(e.dur * 1000), Math.round(tm.intra * 1000)]); } catch(e){}
      }
    }
    morsePre++;
  }
}

function tickPlayback(){
  if (morseStop) return;
  const now = performance.now();
  const elapsed = (now - morsePlayStart) / 1000;
  const loop = $('mLoop').checked;
  let pos = elapsed % morseTotalDur;
  if (elapsed >= morseTotalDur && !loop){
    stopMorse(); setMsg('播放结束', 'ok'); highlightSource(-1); lightOff(); return;
  }
  // 定位当前事件
  const { events } = morseSchedule;
  let cur = -1;
  for (let i = 0; i < events.length; i++){
    const e = events[i];
    if (e.start <= pos && e.start + e.dur > pos){ cur = i; break; }
  }
  // 高亮
  const e = cur >= 0 ? events[cur] : null;
  if (e && e.type === 'mark'){
    highlightSource(e.charIdx, e.sym);
    if ($('mLight').checked){
      const l = $('morseLight'); if (l) l.classList.add('on');
    }
  } else {
    highlightSource(-1);
    lightOff();
  }
  // 时间轴游标
  drawTimelineCursor(pos);
  // 继续预调度
  scheduleAhead();
  morseRafId = requestAnimationFrame(tickPlayback);
}

function highlightSource(charIdx, sym){
  const src = $('morseSource');
  if (!src) return;
  const spans = src.querySelectorAll('.ch');
  spans.forEach(s => {
    s.classList.remove('current');
    if (charIdx >= 0 && s.dataset.idx == charIdx) s.classList.add('current');
    else if (charIdx >= 0 && s.dataset.idx < charIdx) s.classList.add('done');
    else s.classList.remove('done');
  });
  if (sym && $('morseOut')){
    // 表现框当前符号高亮
    $('morseOut').style.background = 'rgba(255,180,84,.18)';
    clearTimeout($('morseOut')._t);
    $('morseOut')._t = setTimeout(() => { if ($('morseOut')) $('morseOut').style.background = ''; }, sym === '.' ? 60 : 180);
  }
}

function lightOff(){ const l = $('morseLight'); if (l) l.classList.remove('on'); }

function stopMorse(silent){
  morseStop = true;
  if (morseRafId){ cancelAnimationFrame(morseRafId); morseRafId = null; }
  // 丢弃未来音频
  if (morseCtx){
    try { morseCtx.close(); } catch(e){}
    morseCtx = null;
  }
  lightOff();
  if (!silent) setMsg('已停止', '');
}

/* --- 统计 --- */
function updateMorseStats(sch){
  const { events, tm } = sch;
  let chars = 0, symbols = 0, dots = 0, dashes = 0, units = 0;
  const seen = new Set();
  for (const e of events){
    if (e.type !== 'mark') continue;
    symbols++;
    if (e.sym === '.'){ dots++; units += 1; } else { dashes++; units += 3; }
    if (!seen.has(e.charIdx)){ seen.add(e.charIdx); chars++; }
  }
  $('sChars').textContent = chars;
  $('sSymbols').textContent = symbols;
  $('sDots').textContent = dots;
  $('sDashes').textContent = dashes;
  $('sUnits').textContent = units;
  // 有效 WPM：units/50 = 字符数，PARIS=50 单位
  const effWpm = units > 0 ? (units / 50) / (sch.duration / 60) : 0;
  $('sDur').textContent = sch.duration.toFixed(1) + 's / ' + effWpm.toFixed(1) + ' WPM';
}

/* --- 时间轴 Canvas 绘制 --- */
function drawTimeline(sch){
  const cv = $('morseTimeline');
  if (!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 800;
  const h = 64;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!sch || !sch.events.length){ return; }
  const dur = sch.duration;
  const { events, tm } = sch;
  // 画背景网格
  ctx.strokeStyle = 'rgba(42,48,60,.6)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++){
    const x = (w / 10) * i;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  }
  for (const e of events){
    const x = (e.start / dur) * w;
    const ew = Math.max((e.dur / dur) * w, 1);
    if (e.type === 'mark'){
      ctx.fillStyle = e.sym === '.' ? '#5b8cff' : '#ffb454';
    } else {
      ctx.fillStyle = 'rgba(154,163,178,.25)';
    }
    // 高度按符号时长比例
    const hh = e.type === 'mark' ? Math.min(h - 8, 8 + (e.dur / (tm.dash * 1.2)) * (h - 16)) : h - 20;
    ctx.fillRect(x, h - hh - 4, ew - 0.5, hh);
  }
  drawTimelineCursor(0);
}

function drawTimelineCursor(pos){
  const cv = $('morseTimeline');
  if (!cv || !morseTotalDur) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 800;
  const h = 64;
  // 重绘游标（在已有内容上加一层，简单做法：先清再画游标需重绘，这里用临时层）
  // 为保持简单，直接重绘整个时间轴再叠加游标
  // 读取缓存的事件（从 drawTimeline 已绘，这里仅画一条线）
  ctx.save();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.strokeStyle = '#3ddc97';
  ctx.lineWidth = 2;
  const x = (pos / morseTotalDur) * w;
  ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
  ctx.restore();
}

/* --- WAV 导出 --- */
async function exportMorseWAV(){
  const text = $('morseText').value || '';
  const sch = buildSchedule(text);
  if (!sch.events.length){ setMsg('没有可导出内容', 'warn'); return; }
  // 限制时长
  const maxDur = 180; // 3 分钟默认
  if (sch.duration > 600){ setMsg('内容过长（>10 分钟），已拒绝导出', 'err'); return; }
  if (sch.duration > maxDur){
    if (!confirm('内容约 ' + sch.duration.toFixed(0) + ' 秒，单声道 WAV 约 ' + (sch.duration * 5.05 / 60).toFixed(1) + ' MiB，确认导出？')) return;
  }
  setMsg('正在渲染 WAV…', '');
  try {
    const sr = 44100;
    const ch = 1;
    const dur = Math.max(0.5, sch.duration + 0.5);
    const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(ch, Math.ceil(sr * dur), sr);
    renderOffline(ctx, sch, ($('mTone') || {}).value || 'sine', clamp(parseInt($('mFreq').value || '600', 10), 200, 1200));
    const buf = await ctx.startRendering();
    const wav = encodeWAV(buf);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'morse_' + Date.now() + '.wav'; a.click();
    URL.revokeObjectURL(url);
    setMsg('已导出 WAV（' + (wav.byteLength / 1048576).toFixed(2) + ' MiB）', 'ok');
  } catch(e){
    setMsg('导出失败：' + e.message, 'err');
  }
}

function renderOffline(ctx, sch, tone, freq){
  const { events, tm } = sch;
  const a = Math.min(0.005, tm.u * 0.05);
  const level = 0.7;
  for (const e of events){
    if (e.type !== 'mark') continue;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = tone === 'cw' ? 'sine' : tone === 'telegraph' ? 'triangle' : 'sine';
    osc.frequency.value = freq;
    let osc2 = null;
    if (tone === 'cw'){
      osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = freq * 2;
      const g2 = ctx.createGain(); g2.gain.value = 0.06; osc2.connect(g2); g2.connect(gain);
    }
    osc.connect(gain); gain.connect(ctx.destination);
    const t0 = e.start, tEnd = e.start + e.dur;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(level, t0 + a);
    gain.gain.setValueAtTime(level, tEnd - a);
    gain.gain.linearRampToValueAtTime(0.0001, tEnd);
    osc.start(t0); osc.stop(tEnd + 0.02);
    if (osc2){ osc2.start(t0); osc2.stop(tEnd + 0.02); }
  }
}

function encodeWAV(buffer){
  const numCh = buffer.numberOfChannels;
  const sr = buffer.sampleRate;
  const len = buffer.getChannelData(0).length;
  const dataLen = len * numCh * 2;
  const ab = new ArrayBuffer(44 + dataLen);
  const view = new DataView(ab);
  const ch0 = buffer.getChannelData(0);
  let offset = 0;
  function ws(s, p){ for (let i = 0; i < s.length; i++) view.setUint8(p + i, s.charCodeAt(i)); }
  ws('RIFF', 0); view.setUint32(4, 36 + dataLen, true); ws('WAVE', 8);
  ws('fmt ', 12); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true); view.setUint32(24, sr, true);
  view.setUint32(28, sr * numCh * 2, true); view.setUint16(32, numCh * 2, true); view.setUint16(34, 16, true);
  ws('data', 36); view.setUint32(40, dataLen, true);
  offset = 44;
  for (let i = 0; i < len; i++){
    let s = ch0[i];
    s = clamp(s, -1, 1);
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
    offset += 2;
  }
  return ab;
}

/* --- 中文 -> 拼音（无声调） --- */
function hanziToPinyin(ch){
  // 先查完整拼音表
  if (HANZI2PY && HANZI2PY[ch] !== undefined) return HANZI2PY[ch];
  return null;
}
function textToPinyin(text){
  // 将文本转为拼音串（汉字转拼音，字母数字保留，标点跳过）
  // 返回 { pinyin: 'NI HAO SHIJIE', tokens: [{type:'py'|'char'|'space'|'skip', raw, value}] }
  const tokens = [];
  let py = '';
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (c === ' '){ tokens.push({ type: 'space', raw: c }); py += ' '; continue; }
    const p = hanziToPinyin(c);
    if (p){
      tokens.push({ type: 'py', raw: c, value: p.toUpperCase() });
      py += p.toUpperCase() + ' ';
    } else if (/[a-zA-Z0-9]/.test(c)){
      tokens.push({ type: 'char', raw: c, value: c.toUpperCase() });
      py += c.toUpperCase() + ' ';
    } else {
      tokens.push({ type: 'skip', raw: c });
    }
  }
  return { pinyin: py.replace(/\s+/g, ' ').trim(), tokens };
}

/* --- 拼音 -> 候选汉字 --- */
function pinyinToCandidates(py){
  if (!PY2HANZI) return '';
  // PY2HANZI 的键是小写拼音，需统一转小写查找
  const key = String(py).toLowerCase().replace(/\d/g, '');
  return PY2HANZI[key] || '';
}

/* --- 实时编码输出（仅点划） --- */
function encodeMorseOnly(text, usePinyin){
  const usePy = usePinyin !== false && $('mPinyin') && $('mPinyin').checked;
  let work = String(text || '').toUpperCase();
  if (usePy){
    // 先转拼音
    const { pinyin } = textToPinyin(text);
    work = pinyin;
  }
  // 拼音/字母串 -> 摩斯
  const words = work.trim().split(/\s+/);
  const morseWords = [];
  for (const w of words){
    if (!w) continue;
    const codes = [];
    for (let i = 0; i < w.length; i++){
      const ch = w[i];
      if (MORSE[ch] !== undefined){ codes.push(MORSE[ch]); }
      // 未识别字符跳过
    }
    if (codes.length) morseWords.push(codes.join(' '));
  }
  return morseWords.join(' / ');
}

/* ============ 事件绑定 ============ */
function bindEvents(mode){
  if (mode === 'symmetric') bindSymmetric();
  else if (mode === 'asymmetric') bindAsymmetric();
  else if (mode === 'morse') bindMorse();
  else if (mode === 'hash') bindHash();
  else if (mode === 'misc') bindMisc();
  else if (mode === 'jwt') bindJWT();
  else if (mode === 'strength') bindStrength();
  else if (mode === 'file') bindFile();
  else if (mode === 'stego') bindStego();
  else if (mode === 'random') bindRandom();
  else if (mode === 'qr') bindQR();
}

function bindSymmetric(){
  STATE.algo = 'aes';
  document.querySelectorAll('#algoTabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector('#algoTabs .tab[data-algo="aes"]').classList.add('active');
  $('algoTabs').onclick = e => {
    const t = e.target.closest('.tab'); if (!t) return;
    document.querySelectorAll('#algoTabs .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active'); STATE.algo = t.dataset.algo; symParams();
  };
  symParams();
  bindCount($('in'), $('inCount'));
  $('encBtn').onclick = () => doSym(true);
  $('decBtn').onclick = () => doSym(false);
  $('copyBtn').onclick = async () => { if (!$('out').value) return; if (await copyText($('out').value)) { flashBadge(); setMsg('已复制到剪贴板', 'ok'); } };
  $('swapBtn').onclick = () => { const v = $('out').value; $('out').value = $('in').value; $('in').value = v; $('inCount').textContent = utf8($('in').value).length + ' 字节'; };
  $('clearBtn').onclick = () => { $('in').value = ''; $('out').value = ''; setMsg('已清空', ''); };
  $('compareBtn').onclick = () => {
    const a = $('in').value, b = $('out').value, c = $('diffCard');
    if (!a || !b) { setMsg('需要输入和输出都有内容', 'warn'); return; }
    c.style.display = 'block';
    let h = '';
    const max = Math.max(a.length, b.length);
    for (let i = 0; i < max; i++){
      if (a[i] === b[i]) h += '<span class="eq">' + escHtml(a[i] || '·') + '</span>';
      else h += '<span class="ne">' + escHtml((a[i] || '∅') + '→' + (b[i] || '∅')) + '</span>';
    }
    $('diffBox').innerHTML = h;
  };
  $('downloadBtn').onclick = () => {
    if (!$('out').value) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([$('out').value], { type: 'text/plain' }));
    a.download = '加密工具_输出.txt'; a.click();
  };
}
async function doSym(isEnc){
  const A = STATE.algo;
  const raw = $('in').value;
  if (!raw && A !== 'base64') { setMsg('请输入内容', 'warn'); return; }
  const batch = $('batchMode').checked;
  try {
    let result;
    if (batch && raw.includes('\n')){
      const lines = raw.split('\n');
      const out = [];
      for (const ln of lines) out.push(await Promise.resolve(runSym(A, ln, isEnc)));
      result = out.join('\n');
    } else {
      result = await runSym(A, raw, isEnc);
    }
    $('out').value = result;
    $('outCount').textContent = utf8(result).length + ' 字节';
    setMsg((isEnc ? '加密' : '解密') + '成功', 'ok');
  } catch (e) { setMsg('失败：' + e.message, 'err'); }
}

function bindMorse(){
  /* --- 模式切换 --- */
  $('morseMode').onclick = e => {
    const t = e.target.closest('.tab'); if (!t) return;
    document.querySelectorAll('#morseMode .tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    STATE.morseMode = t.dataset.m;
    const isTrain = STATE.morseMode === 'train';
    $('convWrap').style.display = isTrain ? 'none' : 'block';
    $('trainWrap').style.display = isTrain ? 'block' : 'none';
    if (isTrain) initKochUI();
  };

  /* --- WPM 滑块 --- */
  const wpmEl = $('mWpm'), effEl = $('mEffWpm'), fnEl = $('mFarnsworth');
  function updateWpmLabel(){
    const c = clamp(parseInt(wpmEl.value, 10) || 18, 5, 40);
    const u = 1.2 / c;
    $('mWpmVal').textContent = c + ' WPM（点长 ' + (u * 1000).toFixed(1) + 'ms）';
  }
  function updateEffLabel(){
    const s = clamp(parseInt(effEl.value, 10) || 8, 5, 40);
    const c = clamp(parseInt(wpmEl.value, 10) || 18, 5, 40);
    $('mEffWpmVal').textContent = s + ' WPM' + (s >= c ? '（Farnsworth 未激活）' : '');
  }
  wpmEl.oninput = () => { updateWpmLabel(); updateEffLabel(); onInputChange(); };
  effEl.oninput = () => { updateEffLabel(); onInputChange(); };
  fnEl.onchange = () => {
    $('farnsworthWrap').style.display = fnEl.checked ? 'block' : 'none';
    updateEffLabel();
  };
  updateWpmLabel(); updateEffLabel();

  /* --- 输入：实时编码（仅点划输出） + 原文高亮 + 拼音预览 --- */
  const srcEl = $('morseSource');
  const outEl = $('morseOut');
  const pyPreview = $('pinyinPreview');
  const pyWrap = $('pinyinPreviewWrap');
  function onInputChange(){
    const v = $('morseText').value;
    const usePy = $('mPinyin').checked;
    const mode = detectMorseMode(v);
    // 表现框：始终输出点划（含中文时经拼音中转）
    const morseOut = encodeMorseOnly(v, usePy);
    outEl.textContent = morseOut || '等待编码…';
    $('morseOutCount').textContent = (morseOut.match(/[.-]/g) || []).length + ' 符号';
    // 原文跟读高亮区
    srcEl.innerHTML = '';
    if (!v.trim()){ srcEl.innerHTML = '<span style="color:var(--sub)">等待输入…</span>'; pyWrap.style.display = 'none'; }
    else if (mode === 'text'){
      // 生成拼音 tokens
      const { tokens } = textToPinyin(v);
      // 拼音预览
      let hasHanzi = tokens.some(t => t.type === 'py');
      if (hasHanzi){
        let pyStr = '';
        tokens.forEach(t => {
          if (t.type === 'py') pyStr += t.value + ' ';
          else if (t.type === 'space') pyStr += '/ ';
        });
        pyPreview.textContent = pyStr.trim();
        pyWrap.style.display = 'block';
      } else {
        pyWrap.style.display = 'none';
      }
      // 原文高亮
      let idx = 0;
      tokens.forEach(t => {
        if (t.type === 'skip') return;
        const sp = document.createElement('span');
        sp.className = 'ch';
        if (t.type === 'py'){
          sp.dataset.idx = idx;
          sp.textContent = t.raw; // 显示原汉字
          sp.title = t.value;     // hover 显示拼音
          idx++;
        } else if (t.type === 'space'){
          sp.dataset.idx = idx;
          sp.textContent = '␣';
          idx++;
        } else if (t.type === 'char'){
          sp.dataset.idx = idx;
          sp.textContent = t.raw;
          if (MORSE[t.value] === undefined){ sp.classList.add('unknown'); sp.title = '未收录字符'; }
          idx++;
        }
        srcEl.appendChild(sp);
      });
    } else {
      // 摩斯输入：尝试解码并显示候选汉字
      srcEl.innerHTML = '<span style="color:var(--brand)">检测到摩斯输入，可点击「▶️ 播放」听音或手动解码</span>';
      pyWrap.style.display = 'none';
      showMorseCandidates(v);
    }
    $('morseCount').textContent = utf8(v).length + ' 字节';
  }
  // 拼音开关变化时重新计算
  $('mPinyin').onchange = onInputChange;
  $('morseText').addEventListener('input', onInputChange);
  onInputChange();

  /* --- 播放 / 停止 --- */
  $('mPlay').onclick = () => {
    if (morseCtx && morseCtx.state === 'suspended') morseCtx.resume();
    playMorse();
  };
  $('mStop').onclick = () => stopMorse();

  /* --- 复制摩斯（仅点划） --- */
  $('mCopy').onclick = async () => {
    const out = encodeMorseOnly($('morseText').value);
    if (!out){ setMsg('没有可复制的摩斯码', 'warn'); return; }

/* --- 摩斯 -> 拼音/汉字候选 --- */
function showMorseCandidates(code){
  const usePy = $('mPinyin').checked;
  if (!usePy){ return; }
  // 解码：点划串 -> 字母/数字 -> 拼音 -> 候选汉字
  const words = code.trim().split(/\s*\/\s*|\s{2,}/);
  let pyResult = [];
  words.forEach(w => {
    const syms = w.split(/\s+/).filter(Boolean);
    const decoded = syms.map(s => {
      const key = s.replace(/_/g, '-').replace(/·/g, '.');
      return MORSE[key] !== undefined ? MORSE[key] : '?';
    }).join('');
    pyResult.push(decoded);
  });
  const pyStr = pyResult.join(' ');
  // 查找候选汉字
  let candHtml = '';
  pyResult.forEach(py => {
    if (!py) return;
    const chars = pinyinToCandidates(py);
    if (chars){ candHtml += '<span style="margin-right:12px"><b style="color:var(--brand)">' + py + '</b>：' + chars.slice(0, 20) + (chars.length > 20 ? '…' : '') + '</span>'; }
  });
  let box = $('morseCandidates');
  if (!box){
    box = document.createElement('div');
    box.id = 'morseCandidates';
    box.style.cssText = 'margin-top:12px;padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;';
    $('convWrap').insertBefore(box, $('morseStats'));
  }
  if (candHtml){
    box.innerHTML = '<div style="font-size:12px;color:var(--sub);margin-bottom:6px">解码候选（拼音→汉字，重音需自行判断）：</div>' + candHtml;
    box.style.display = 'block';
  } else {
    box.style.display = 'none';
  }
}

function doMorseDecode(){
  const v = $('morseText').value;
  if (!v.trim()){ setMsg('请输入摩斯码', 'warn'); return; }
  const usePy = $('mPinyin').checked;
  const words = v.trim().split(/\s*\/\s*|\s{2,}/);
  let result = [];
  words.forEach((w, wi) => {
    if (wi > 0) result.push(' ');
    w.split(/\s+/).filter(Boolean).forEach(s => {
      const key = s.replace(/_/g, '-').replace(/·/g, '.');
      const ch = MORSE_RE[key] !== undefined ? MORSE_RE[key] : '?';
      result.push(ch);
    });
  });
  const decoded = result.join('');
  $('morseOut').textContent = decoded;
  $('morseOutCount').textContent = decoded.length + ' 字符';
  setMsg('解码结果：' + decoded, 'ok');
  if (usePy){
    showMorseCandidates(v);
  } else {
    const box = $('morseCandidates');
    if (box) box.style.display = 'none';
  }
}

/* ==================== 训练模式 ==================== */
const KOCH_SEQ = 'KMRSUAPTLOWI.NJEF0Y,VG5/Q9ZH8B?4273'.split(''); // 标准 Koch 字符序列
const TRAIN_WORDS = ['SOS','CQ','DX','QRZ','73','88','55','TEST','HELLO','WX','QTH','NAME','RST','UR','OP','SK','KN','BK','CL','TU','GM','GA','GE','GN','OM','PSE','HW','CFM','AGN','NIL'];
let trainState = {
  mode: 'char',
  kochIdx: 2,
  roundLen: 50,
  current: '',
  results: [],     // {ch, correct, rt}
  wrong: {},       // {ch: {wrong, total}}
  round: 0,
  inRound: false,
};

function initTrainMode(){
  // 训练子模式切换
  $('trainModeSeg').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;

    b.classList.add('active');

  };

function renderKochProgress(){
  const box = $('kochProgress');
  if (!box) return;
  let h = '';
  KOCH_SEQ.forEach((c, i) => {
    const w = trainState.wrong[c];
    const rate = w && w.total ? Math.round((1 - w.wrong / w.total) * 100) : null;
    let cls = 'koch-char';
    if (i < trainState.kochIdx) cls += ' mastered';
    else if (w && w.wrong / Math.max(w.total, 1) > 0.3) cls += ' struggle';
    h += '<div class="' + cls + '" data-kc="' + c + '"><span class="c">' + c + '</span><span class="rate">' +
      (rate === null ? '—' : rate + '%') + '</span></div>';
  });
  box.innerHTML = h;
  box.querySelectorAll('.koch-char').forEach(el => {
    el.onclick = () => {
      const c = el.dataset.kc;
      const idx = KOCH_SEQ.indexOf(c);
      if (idx < trainState.kochIdx) trainState.kochIdx = idx + 1;
      else trainState.kochIdx = idx + 2;
      $('kochChars').value = trainState.kochIdx;
      renderKochProgress();
    };
  });
}

function initTrainMode(){
  // 训练输入与按钮
  const inp = $('morseTrainInput');
  inp.oninput = () => {
    const v = inp.value.toUpperCase();
    inp.value = v;
  };
  inp.onkeydown = e => {
    if (e.key === 'Enter') submitTrainAnswer();
  };
  $('mTrainPlay').onclick = () => {
    if (!trainState.current){ setTrainStatus('请先点击「开始练习」', 'warn'); return; }
    // 临时塞入 morseText 播放
    const prev = $('morseText').value;
    $('morseText').value = trainState.current;
    playMorse();
    setTimeout(() => { $('morseText').value = prev; }, 100);
  };
  $('mTrainStart').onclick = startTrainRound;
  $('mTrainReveal').onclick = revealTrainAnswer;
  $('mTrainReport').onclick = toggleTrainReport;
}

function startTrainRound(){
  const mode = trainState.mode;
  let pool = [];
  if (mode === 'koch'){
    pool = KOCH_SEQ.slice(0, trainState.kochIdx);
  } else if (mode === 'char'){
    pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
  } else if (mode === 'word'){
    pool = TRAIN_WORDS;
  }
  if (!pool.length){ setTrainStatus('词库为空', 'err'); return; }
  const len = mode === 'word' ? 10 : trainState.roundLen;
  let seq = '';
  const buf = new Uint32Array(len);
  crypto.getRandomValues(buf);
  for (let i = 0; i < len; i++){
    seq += pool[buf[i] % pool.length];
    if (mode === 'word' && i < len - 1) seq += ' ';
  }
  trainState.current = seq;
  trainState.results = [];
  trainState.round++;
  trainState.inRound = true;
  $('morseTrainInput').value = '';
  $('morseTrainInput').focus();
  setTrainStatus('第 ' + trainState.round + ' 轮：正在播放…', '');
  $('morseTrainFeedback').textContent = '听音后输入你听到的内容';
  $('morseTrainFeedback').className = '';
  // 播放
  const prev = $('morseText').value;
  $('morseText').value = seq;
  playMorse();
  // 播放结束后允许输入
  const wait = () => {
    if (morseStop && trainState.inRound){
      // 播放结束，等待输入
      $('morseTrainFeedback').textContent = '请输入你听到的内容（回车提交）';
    } else if (trainState.inRound){
      setTimeout(wait, 200);
    }
  };
  setTimeout(wait, 100);
  $('morseText').value = prev;
}

function submitTrainAnswer(){
  if (!trainState.inRound) return;
  const ans = $('morseTrainInput').value.toUpperCase();
  const correct = trainState.current.toUpperCase();
  const fb = $('morseTrainFeedback');
  // 逐字符判定
  let ok = 0, total = 0;
  const max = Math.max(ans.length, correct.length);
  let detail = '';
  for (let i = 0; i < max; i++){
    total++;
    const a = ans[i], c = correct[i];
    if (a === c && a !== undefined){
      ok++; detail += '<span style="color:var(--ok)">' + (c || '·') + '</span>';
    } else {
      detail += '<span style="color:var(--err);background:rgba(255,107,107,.15);padding:0 2px">' + (c || '∅') + '</span>';
    }
  }
  const rate = Math.round(ok / Math.max(total, 1) * 100);
  // 记录错误字符
  for (let i = 0; i < correct.length; i++){
    const c = correct[i];
    if (!c || c === ' ') continue;
    if (!trainState.wrong[c]) trainState.wrong[c] = { wrong: 0, total: 0 };
    trainState.wrong[c].total++;
    if (ans[i] !== c) trainState.wrong[c].wrong++;
  }
  trainState.inRound = false;
  fb.innerHTML = '正确率 ' + rate + '% （' + ok + '/' + total + '）<br>' + detail;
  fb.className = rate >= 90 ? 'ok' : 'err';
  setTrainStatus('本轮结束，正确率 ' + rate + '%', rate >= 90 ? 'ok' : 'warn');
  renderKochProgress();
  // Koch 进阶判定
  if (trainState.mode === 'koch' && trainState.kochIdx < KOCH_SEQ.length){
    const pool = KOCH_SEQ.slice(0, trainState.kochIdx);
    const allGood = pool.every(c => {
      const w = trainState.wrong[c];
      return w && w.total >= 2 && (1 - w.wrong / w.total) >= 0.9;
    });
    if (allGood){
      trainState.kochIdx++;
      $('kochChars').value = trainState.kochIdx;
      renderKochProgress();
      setTrainStatus('🎉 掌握新字符：' + KOCH_SEQ[trainState.kochIdx - 1] + '，已加入词表', 'ok');
    }
  }
}

async function calcHash(src){
  let data;
  if (src === 'file'){
    const f = window._hFile;
    if (!f) { setMsg('请先选择文件', 'warn'); return; }
    data = new Uint8Array(await f.arrayBuffer());
  } else {
    data = utf8($('in').value);
  }
  const opts = Array.from($('hAlgo').selectedOptions).map(o => o.value);
  if (!opts.length) { setMsg('请选择至少一种算法', 'warn'); return; }
  const upper = $('hUpper').checked, hmacKey = $('hmacKey').value;
  const expect = ($('hCustom').value || '').trim().toLowerCase();
  const grid = $('hResult'); grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (const name of opts){
    let hex;
    try {
      if (name === 'MD5-JS') hex = md5(fromUtf8(data));
      else if (name === 'SHA3-JS') hex = sha3_256(fromUtf8(data));
      else if ($('hHmac').checked && hmacKey){
        const k = await crypto.subtle.importKey('raw', utf8(hmacKey), { name: 'HMAC', hash: name }, false, ['sign']);
        const buf = await crypto.subtle.sign('HMAC', k, data);
        hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      } else {
        const buf = await crypto.subtle.digest(name, data);
        hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { hex = 'ERROR'; }
    if (!upper) hex = hex.toLowerCase();
    const item = document.createElement('div');
    item.className = 'hash-item';
    if (expect && hex !== 'ERROR'){
      item.classList.add(hex.toLowerCase() === expect ? 'match' : 'mismatch');
    }
    item.innerHTML = '<div class="hn">' + name + '</div><div class="hv">' + hex + '</div>';
    item.onclick = async () => { if (await copyText(hex)) setMsg(name + ' 已复制', 'ok'); };
    frag.appendChild(item);
  }
  grid.appendChild(frag);
  if (expect){
    const match = grid.querySelector('.match');
    setMsg(match ? '✅ 与预期哈希值完全一致' : '❌ 与预期哈希值不一致', match ? 'ok' : 'err');
  } else setMsg('计算完成，点击任意卡片复制', 'ok');
}

function miscParams(){
  const m = STATE.misc || 'b64';
  let h = '';
  if (m === 'md5js') h = '<div class="note warn">纯 JS 实现的 MD5，已被碰撞攻击攻破，仅用于兼容老旧系统。</div>';
  if (m === 'url') h += '<div class="note">编码使用 encodeURIComponent，解码使用 decodeURIComponent。</div>';
  if (m === 'unicode') h += '<div class="note">把每个字符转成 \\uXXXX 形式。</div>';
  if (m === 'html') h += '<div class="note">转义 &lt; &gt; &amp; &quot; 等 HTML 特殊字符。</div>';
  $('miscParams').innerHTML = h;

function doMisc(m, enc){
  const v = $('in').value; let out = '';
  try {
    if (m === 'b64') out = enc ? b64encode(utf8(v)) : fromUtf8(b64decode(v));
    else if (m === 'hex'){
      if (enc){ const b = utf8(v); out = ''; for (const x of b) out += x.toString(16).padStart(2, '0'); }
      else { v = v.replace(/\s/g, ''); const b = new Uint8Array(v.length/2); for (let i = 0; i < b.length; i++) b[i] = parseInt(v.substr(i*2, 2), 16); out = fromUtf8(b); }
    }
    else if (m === 'url') out = enc ? encodeURIComponent(v) : decodeURIComponent(v);
    else if (m === 'unicode'){
      if (enc){ out = ''; for (const c of v) out += '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0'); }
      else out = v.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
    }
    else if (m === 'html'){
      if (enc) out = v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
      else out = v.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');
    }
    else if (m === 'reverse') out = v.split('').reverse().join('');
    else if (m === 'md5js') out = md5(v);
    $('out').value = out; setMsg('处理完成', 'ok');
  } catch (e) { setMsg('失败：' + e.message, 'err'); }
}

function parseJWT(tok){
  const parts = tok.split('.');
  if (parts.length !== 3) { $('jwtResult').innerHTML = '<div class="note err">格式错误：JWT 应为 header.payload.signature 三段，用 . 分隔</div>'; return; }
  const [h, p, s] = parts;
  let header, payload;
  try { header = JSON.parse(fromUtf8(b64decode(h))); } catch(e){ header = null; }
  try { payload = JSON.parse(fromUtf8(b64decode(p))); } catch(e){ payload = null; }
  const now = Math.floor(Date.now() / 1000);
  let expNote = '';
  if (payload && payload.exp){
    const left = payload.exp - now;
    expNote = left > 0
      ? '<div class="note ok">✅ 有效期还剩 ' + Math.floor(left/60) + ' 分 ' + (left%60) + ' 秒</div>'
      : '<div class="note err">❌ 已于 ' + Math.floor(-left/86400) + ' 天前过期</div>';
  }
  const hf = JSON.stringify(header, null, 2), pf = JSON.stringify(payload, null, 2);
  $('jwtResult').innerHTML = `
    <div class="jwt-box" style="margin-top:12px">
      <div class="jwt-p jwt-h"><span>HEADER</span><span>${escHtml(hf)}</span></div>
      <div class="jwt-p"><span>PAYLOAD</span><span>${escHtml(pf)}</span></div>
      <div class="jwt-p jwt-s"><span>SIGNATURE</span><span>${escHtml(s)}</span></div>
    </div>
    ${header && header.alg ? '<div class="note">算法：<b>' + escHtml(header.alg) + '</b>' + (header.kid ? ' · kid：<b>' + escHtml(header.kid) + '</b>' : '') + '</div>' : ''}
    ${expNote}
    <div class="note warn">解析完全在本地完成，未向任何服务器发送请求。本地无法验证签名有效性（需要原始密钥）。</div>
  `;
}

function bindStrength(){
  const inp = $('pwIn'), bar = $('pwBar'), score = $('pwScore'), crit = $('pwCrit');
  const DICT = ['password','123456','qwerty','letmein','welcome','admin','monkey','dragon','master','login','abc123','111111','666666','888888','000000','123123','123321','123qwe','1q2w3e','q1w2e3','abcdef','abcabc','test','p@ssw0rd','passwd','iloveyou','sunshine','football','baseball','princess'];
  function check(){
    const v = inp.value;
    let sc = 0, items = [];
    const has = (c, t) => items.push({ ok: c, label: t });
    has(v.length >= 12, '≥ 12 位');
    has(v.length >= 16, '≥ 16 位');
    has(/[a-z]/.test(v), '小写字母');
    has(/[A-Z]/.test(v), '大写字母');
    has(/[0-9]/.test(v), '数字');
    has(/[^A-Za-z0-9]/.test(v), '特殊符号');
    has(!/(.)\1{2,}/.test(v), '无连续重复字符');
    has(!/^(123|abc|qwe|asd|zxc)/i.test(v), '开头无常见序列');
    const low = v.toLowerCase();
    has(!DICT.some(d => low.includes(d)), '无常见弱词');
    const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(v)).length;
    if (classes >= 3) sc += 15;
    if (v.length >= 8) sc += 15; else sc -= 20;
    if (v.length >= 12) sc += 15;
    if (v.length >= 16) sc += 15;
    sc += Math.min(20, classes * 5);
    if (/(.)\1{2,}/.test(v)) sc -= 15;
    if (DICT.some(d => low.includes(d))) sc -= 30;
    if (/^(19|20)\d{2}$/.test(v)) sc -= 10;
    sc = Math.max(0, Math.min(100, sc + 20));
    const colors = ['var(--err)','var(--err)','var(--warn)','var(--warn)','var(--ok)','var(--ok)'];
    const labels = ['极弱','很弱','较弱','一般','较强','很强'];
    bar.style.width = sc + '%';
    bar.style.background = colors[Math.floor(sc/20)];
    score.textContent = v ? '强度：' + labels[Math.floor(sc/20)] + '（' + sc + '/100）' : '未评估';
    score.style.color = colors[Math.floor(sc/20)];
    crit.innerHTML = items.map(i => '<span class="' + (i.ok ? 'yes' : '') + '">' + (i.ok ? '✓ ' : '✗ ') + i.label + '</span>').join('');
    if (v && sc >= 80) setMsg('密码强度良好', 'ok');
    else if (v) setMsg('可按绿色条件继续加强', warn);
  }
  inp.addEventListener('input', check);
  $('pwShow').onchange = () => { inp.type = $('pwShow').checked ? 'text' : 'password'; };
  check();
}

  function handleFile(f){
    window._fFile = f;
    $('fInfo').textContent = f ? f.name + '（' + (f.size/1024).toFixed(1) + ' KB）' : '未选择文件';
  }
  $('fEnc').onclick = () => doFile(true);
  $('fDec').onclick = () => doFile(false);
}
async function doFile(enc){
  const f = window._fFile;
  if (!f) { setMsg('请先选择文件', 'warn'); return; }
  const pwd = $('fKey').value;
  if (!pwd && enc) { setMsg('请填写密码', 'warn'); return; }
  const prog = $('fProg'); prog.classList.add('show');
  const salt = crypto.getRandomValues(new Uint8Array(16));
  try {
    if (enc){
      const k = await deriveKey(pwd, salt, 310000, 256);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const buf = await f.arrayBuffer();
      prog.firstElementChild.style.width = '40%';
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, buf);
      prog.firstElementChild.style.width = '90%';
      const blob = new Blob([concat([salt, iv, new Uint8Array(ct)])]);
      downloadBlob(blob, f.name + '.enc');
      setMsg('加密完成：' + f.name + '.enc', 'ok');
    } else {
      const buf = new Uint8Array(await f.arrayBuffer());
      if (buf.length < 44) throw new Error('文件过短，不是有效的加密文件');
      const fsalt = buf.slice(0, 16), iv = buf.slice(16, 28), ct = buf.slice(28);
      const k = await deriveKey(pwd, fsalt, 310000, 256);
      prog.firstElementChild.style.width = '50%';
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, k, ct);
      prog.firstElementChild.style.width = '90%';
      const name = f.name.endsWith('.enc') ? f.name.slice(0, -4) : f.name + '.dec';
      downloadBlob(new Blob([pt]), name);
      setMsg('解密完成：' + name, 'ok');
    }
  } catch (e) { setMsg('失败：' + e.message, 'err'); }
  finally { setTimeout(() => prog.classList.remove('show'), 400); }
}
function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

  $('sHide').onclick = hideStego;

async function hideStego(){
  const f = window._sFile; if (!f) { setMsg('请先选择 PNG 图片', 'warn'); return; }
  const msg = $('sMsg').value; if (!msg) { setMsg('请输入要隐藏的信息', 'warn'); return; }
  const img = await createImageBitmap(f);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, c.width, c.height);
  const bits = [];
  for (const b of utf8(msg)) for (let i = 7; i >= 0; i--) bits.push((b >> i) & 1);
  bits.push(0,0,0,0,0,0,0,0);
  if (bits.length > data.data.length / 4 * 8) { setMsg('信息过长，该图片最多容纳 ' + Math.floor(data.data.length / 32) + ' 字节', 'err'); return; }
  let bi = 0;
  for (let i = 0; i < data.data.length && bi < bits.length; i += 4){
    for (let ch = 0; ch < 3 && bi < bits.length; ch++, bi++) data.data[i + ch] = (data.data[i + ch] & 0xfe) | bits[bi];
  }
  ctx.putImageData(data, 0, 0);
  c.toBlob(blob => { downloadBlob(blob, 'stego_' + f.name); setMsg('已生成隐写图片', 'ok'); }, 'image/png');
}
async function readStego(){
  const f = window._sFile; if (!f) { setMsg('请先选择 PNG 图片', 'warn'); return; }
  const img = await createImageBitmap(f);
  const c = document.createElement('canvas');
  c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  const data = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
  const bits = [];
  for (let i = 0; i < data.length; i += 4) for (let ch = 0; ch < 3; ch++) bits.push(data[i + ch] & 1);
  const bytes = [];
  for (let i = 0; i < bits.length; i += 8){
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    if (v === 0) break;
    bytes.push(v);
  }
  try { setMsg('隐藏信息：' + fromUtf8(new Uint8Array(bytes)), 'ok'); }
  catch(e){ setMsg('读取失败，图片可能不含有效信息', 'err'); }
}

      <div class="tab active" data-f="RSA-2048">RSA 2048</div><div class="tab" data-f="RSA-4096">RSA 4096</div><div class="tab" data-f="ECDSA-P256">ECDSA P-256</div>

  }

  };

async function genRandom(type){
  const flags = () => Array.from(document.querySelectorAll('#rngFlags .tab.active')).map(t => t.dataset.f);
  if (type === 'pwd'){
    const len = parseInt($('pwdLen').value || '24', 10), fs = flags();
    const pool = { U:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', L:'abcdefghijklmnopqrstuvwxyz', N:'0123456789', S:'!@#$%^&*-_=+?' }[k];
    let charset = '';
    fs.forEach(f => charset += ({U:'ABCDEFGHIJKLMNOPQRSTUVWXYZ',L:'abcdefghijklmnopqrstuvwxyz',N:'0123456789',S:'!@#$%^&*-_=+?'})[f] || '');
    if (!charset) { setMsg('请至少选择一种字符类型', 'warn'); return; }
    const buf = new Uint8Array(len * 2);
    let out = '';
    while (out.length < len){
      crypto.getRandomValues(buf);
      for (const b of buf){ if (b < charset.length && out.length < len) out += charset[b % charset.length]; }
    }
    $('out').value = out; setMsg('已生成 ' + len + ' 位密码', 'ok');
  } else if (type === 'bytes'){
    const len = parseInt($('byteLen').value || '32', 10), fs = flags();
    const buf = new Uint8Array(len); crypto.getRandomValues(buf);
    $('out').value = (fs[0] === 'b64' ? b64encode(buf) : [...buf].map(b => b.toString(16).padStart(2, '0')).join(''));
    setMsg('已生成 ' + len + ' 字节', 'ok');
  } else if (type === 'uuid'){
    const buf = new Uint8Array(16); crypto.getRandomValues(buf);
    buf[6] = (buf[6] & 0x0f) | 0x40; buf[8] = (buf[8] & 0x3f) | 0x80;
    let s = [...buf].map(b => b.toString(16).padStart(2, '0')).join('');
    s = s.slice(0,8)+'-'+s.slice(8,12)+'-'+s.slice(12,16)+'-'+s.slice(16,20)+'-'+s.slice(20);
    $('out').value = s; setMsg('UUID v4 已生成', 'ok');
  } else if (type === 'dice'){
    const n = parseInt($('diceNum').value || '5', 10), face = parseInt($('diceFace').value || '6', 10);
    const buf = new Uint8Array(n); crypto.getRandomValues(buf);
    const res = [...buf].map(b => b % face + 1).join(', ');
    const sum = [...buf].map(b => b % face + 1).reduce((a,b)=>a+b,0);
    $('out').value = res + '\n合计：' + sum;
    setMsg('掷骰结果', 'ok');
  } else if (type === 'keypair'){
    const f = flags()[0] || 'RSA-2048';
    let algo;
    if (f.startsWith('RSA')) algo = { name: 'RSA-PSS', modulusLength: f === 'RSA-4096' ? 4096 : 2048, publicExponent: new Uint8Array([1,0,1]), hash: 'SHA-256' };
    else algo = { name: 'ECDSA', namedCurve: 'P-256' };
    const pair = await crypto.subtle.generateKey(algo, true, ['sign','verify']);
    const pub = await crypto.subtle.exportKey('spki', pair.publicKey);
    const priv = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
    $('out').value = '-----BEGIN PUBLIC KEY-----\n' + b64encode(new Uint8Array(pub)).match(/.{1,64}/g).join('\n') + '\n-----END PUBLIC KEY-----\n\n-----BEGIN PRIVATE KEY-----\n' + b64encode(new Uint8Array(priv)).match(/.{1,64}/g).join('\n') + '\n-----END PRIVATE KEY-----';
    setMsg(f + ' 密钥对已生成（含私钥，请妥善保管）', 'ok');
  }
}

function genQR(){
  const text = $('qrIn').value;

  if (!window.QRCode) { setMsg('二维码库未加载，请检查网络或改用本地服务器打开', 'err'); return; }
  const box = $('qrBox'); box.innerHTML = '<canvas id="qrCanvas"></canvas><div id="qrText"></div>';
  window.QRCode.toCanvas($('qrCanvas'), text, { errorCorrectionLevel: $('qrLevel').value, width: 240, margin: 2 }, err => {

async function scanQR(file){
  if (!file) return;
  try {
    const bmp = await createImageBitmap(file);
    const c = document.createElement('canvas');
    c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    if ('BarcodeDetector' in window){
      const det = new BarcodeDetector({ formats: ['qr_code'] });
      const r = await det.detect(c);
      if (r[0]){ $('qrIn').value = r[0].rawValue; setMsg('识别成功', 'ok'); return; }
    }
    setMsg('未能识别二维码（当前浏览器不支持 BarcodeDetector，可尝试 Chrome）', 'warn');
  } catch (e) { setMsg('识别失败：' + e.message, 'err'); }
}

function aParams(){
  const a = STATE.a || 'rsa';
  let h = '';
  if (a === 'rsa') h = `<label for="rsaSize">密钥长度</label><select id="rsaSize"><option>2048</option><option selected>4096</option></select>
    <div class="note">RSA-OAEP + SHA-256，4096 位更安全但更慢。</div>`;
  else h = `<label for="eccCurve">曲线</label><select id="eccCurve"><option>P-256</option><option selected>P-384</option><option>P-521</option></select>
    <div class="note">ECDH 只做密钥协商，不直接加密数据，协商出的共享密钥可再用于对称加密。</div>`;
  $('aParams').innerHTML = h;
}
async function genKey(a){
  const cfg = a === 'rsa'
    ? { name: 'RSA-OAEP', modulusLength: parseInt($('rsaSize').value || '4096', 10), publicExponent: new Uint8Array([1,0,1]), hash: 'SHA-256' }
    : { name: 'ECDH', namedCurve: $('eccCurve').value || 'P-384' };
  const pair = await crypto.subtle.generateKey(cfg, true, a === 'rsa' ? ['encrypt','decrypt'] : ['deriveKey','deriveBits']);
  window._aPair = pair;
  const pub = await crypto.subtle.exportKey('spki', pair.publicKey);
  const priv = await crypto.subtle.exportKey('pkcs8', pair.privateKey);
  $('pubKey').value = '-----BEGIN PUBLIC KEY-----\n' + b64encode(new Uint8Array(pub)).match(/.{1,64}/g).join('\n') + '\n-----END PUBLIC KEY-----';
  $('privKey').value = '-----BEGIN PRIVATE KEY-----\n' + b64encode(new Uint8Array(priv)).match(/.{1,64}/g).join('\n') + '\n-----END PRIVATE KEY-----';
  $('aKeyTag').textContent = '已生成';
  setMsg('密钥对已生成', 'ok');
}
async function expPub(){
  if (!$('pubKey').value) { setMsg('请先生成密钥对', 'warn'); return; }
  if (await copyText($('pubKey').value)) setMsg('公钥已复制', 'ok');
}
async function impPub(){
  const v = window.prompt('粘贴 PEM 格式的公钥：');
  if (!v) return;
  try {
    const b64 = v.replace(/-----[^-]+-----/g, '').replace(/\s/g, '');
    const key = await crypto.subtle.importKey('spki', b64decode(b64), { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    window._aPub = key; window._aPubRaw = v.trim();
    $('pubKey').value = v.trim();
    setMsg('公钥已导入', 'ok');
  } catch (e) { setMsg('导入失败：' + e.message, 'err'); }
}
async function aCrypto(a, enc){
  const pair = window._aPair;
  if (!pair) { setMsg('请先生成或导入密钥对', 'warn'); return; }
  const text = $('in').value;
  try {
    if (a === 'rsa'){
      if (enc){
        const buf = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pair.publicKey, utf8(text));
        $('out').value = b64encode(new Uint8Array(buf));
      } else {
        const buf = await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, pair.privateKey, b64decode($('out').value || text));
        $('out').value = fromUtf8(new Uint8Array(buf));
      }
    } else {
      const cfg = { name: 'ECDH', namedCurve: $('eccCurve').value || 'P-384' };
      const own = await crypto.subtle.generateKey(cfg, false, ['deriveKey']);
      const shared = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: pair.publicKey }, own.privateKey,
        { name: 'AES-GCM', length: 256 }, false, ['encrypt','decrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, shared, utf8(text));
      const pubRaw = await crypto.subtle.exportKey('raw', own.publicKey);
      $('out').value = b64encode(concat([new Uint8Array(pubRaw), iv, new Uint8Array(ct)]));
      setMsg('ECDH 协商密钥后已用 AES-256-GCM 加密', 'ok');
      return;
    }
    setMsg((enc ? '加密' : '解密') + '成功', 'ok');
  } catch (e) { setMsg('失败：' + e.message, 'err'); }
}
async function aSign(a){
  const pair = window._aPair;
  if (!pair) { setMsg('请先生成密钥对', 'warn'); return; }
  const cfg = a === 'rsa' ? { name: 'RSA-PSS', saltLength: 32 } : { name: 'ECDSA', hash: 'SHA-256' };
  const sig = await crypto.subtle.sign(cfg, pair.privateKey, utf8($('in').value));
  $('out').value = b64encode(new Uint8Array(sig));
  setMsg('签名完成', 'ok');
}
async function aVerify(a){
  const pair = window._aPair;
  if (!pair) { setMsg('请先生成或导入密钥对', 'warn'); return; }
  const cfg = a === 'rsa' ? { name: 'RSA-PSS', saltLength: 32 } : { name: 'ECDSA', hash: 'SHA-256' };
  try {
    const ok = await crypto.subtle.verify(cfg, pair.publicKey, b64decode($('out').value), utf8($('in').value));
    setMsg(ok ? '✅ 签名验证通过' : '❌ 签名验证失败', ok ? 'ok' : 'err');
  } catch (e) { setMsg('验证失败：' + e.message, 'err'); }
}

/* ============ 启动 ============ */
function renderEnv(){
  const c = !!(window.crypto && crypto.subtle);
  if (!c) setMsg('当前环境不支持 Web Crypto API，部分加密功能不可用，建议通过本地服务器打开', 'warn');
}
STATE.algo = 'aes';
renderEnv();
render('symmetric');
</script>
